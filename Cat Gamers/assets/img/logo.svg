<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Fondo circular en café chocolate profundo -->
  <circle cx="250" cy="250" r="230" fill="#2C1B17" />
  
  <!-- Cabeza de gato estilizada en color crema cálido -->
  <path d="M 120 180 
           L 170 100 
           L 210 160 
           L 290 160 
           L 330 100 
           L 380 180 
           C 420 250, 420 380, 250 380 
           C 80 380, 80 250, 120 180 Z" 
        fill="#F5EBE0" stroke="#E6CCB2" stroke-width="8" stroke-linejoin="round"/>

  <!-- Orejas internas en rosado terracota suave -->
  <polygon points="145,160 170,120 190,160" fill="#E8A598" />
  <polygon points="355,160 330,120 310,160" fill="#E8A598" />

  <!-- D-Pad / Cruceta (Ojo izquierdo) en Verde Menta -->
  <rect x="155" y="210" width="15" height="45" rx="3" fill="#A8DADC" />
  <rect x="140" y="225" width="45" height="15" rx="3" fill="#A8DADC" />

  <!-- Botones A B X Y (Ojo derecho) en tonos pastel cálidos -->
  <circle cx="335" cy="215" r="9" fill="#F4A261" /> <!-- Botón Y -->
  <circle cx="355" cy="232" r="9" fill="#E76F51" /> <!-- Botón B -->
  <circle cx="315" cy="232" r="9" fill="#E9C46A" /> <!-- Botón X -->
  <circle cx="335" cy="250" r="9" fill="#2A9D8F" /> <!-- Botón A -->

  <!-- Nariz en rosado terracota -->
  <polygon points="250,250 240,235 260,235" fill="#E8A598" />

  <!-- Hocico en marrón oscuro -->
  <path d="M 230 260 Q 250 275 270 260" stroke="#2C1B17" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Bigotes en beige suave -->
  <line x1="90" y1="240" x2="130" y2="245" stroke="#E6CCB2" stroke-width="4" stroke-linecap="round"/>
  <line x1="80" y1="265" x2="125" y2="265" stroke="#E6CCB2" stroke-width="4" stroke-linecap="round"/>
  
  <line x1="410" y1="240" x2="370" y2="245" stroke="#E6CCB2" stroke-width="4" stroke-linecap="round"/>
  <line x1="420" y1="265" x2="375" y2="265" stroke="#E6CCB2" stroke-width="4" stroke-linecap="round"/>
</svg>
