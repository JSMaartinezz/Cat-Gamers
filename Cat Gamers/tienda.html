<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda</title>
    <link rel="stylesheet" href="css/tienda.css">
</head>
<body>
    <div class="main-container">
        <div class="tarjeta-producto">
            <img class="imagen-producto" src="assets/img/rascador-retro-arcade.png" alt="foto maquina retro rascador">
            <h2 class="titulo-producto">Rascador Torre Arcade</h2>
            <ul class="lista-detalles-producto">
                <li class="descripcion-producto">Rascador de sisal de alta resistencia con diseño retro arcade. Incluye cueva interior y plataforma elevada para que tu gato descanse tras sus partidas.</li>
                <li class="categoria-producto">Muebles</li>
                <li class="precio-producto">45.99€</li>
            </ul>
            <button class="añadir-carrito">Añadir al carrito</button>
        </div>
    </div>
    <script src="js/tienda.js"></script>
</body>
</html>
